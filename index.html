<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notedown</title>
    <meta name="description" content="Notedown — a local-first Markdown editor with live preview." />
    <meta name="theme-color" content="#1e1e1e" />
    <meta property="og:title" content="Notedown" />
    <meta property="og:description" content="Notedown — a local-first Markdown editor with live preview." />
    <meta property="og:type" content="website" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: asset: http://asset.localhost https:; connect-src 'self' ipc: http://ipc.localhost ws: http: https:; font-src 'self' data:; worker-src 'self' blob:; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <link rel="stylesheet" href="/src/styles/menu.css" />
    <link rel="stylesheet" href="/src/styles/editor.css" />
    <link rel="stylesheet" href="/src/styles/responsive.css" />
    <link rel="stylesheet" href="/src/styles/settings.css" />
    <link rel="stylesheet" href="/src/styles/help.css" />
    <link rel="stylesheet" href="/src/styles/about.css" />
    <link rel="stylesheet" href="/src/styles/import.css" />
    <link rel="stylesheet" href="/src/styles/export.css" />
    <link rel="stylesheet" href="/src/styles/graph-dialog.css" />
    <link rel="stylesheet" href="/src/styles/table-dialog.css" />
    <link rel="stylesheet" href="/src/styles/navigator.css" />
  </head>
  <body>
    <div id="app">
      <header id="menubar" role="menubar" aria-label="Menu bar">
        <div id="menubar-root"></div>
      </header>
      <main id="editor-area">
        <aside id="navigator-panel" class="navigator" aria-label="Document navigator" hidden></aside>
        <div id="editor" class="editor-pane" aria-label="Editor"></div>
      </main>
      <footer id="statusbar" class="statusbar" role="status">
        <span id="status-filename">untitled.md</span>
        <span id="status-dirty" class="dirty-dot" hidden title="Unsaved changes"></span>
        <span class="status-spacer"></span>
        <span id="status-mode">Live</span>
        <span id="status-ln">Ln 1</span>
        <span id="status-col">Col 1</span>
        <span id="status-words">0 words</span>
        <span id="status-chars">0 chars</span>
      </footer>
      <div id="settings-modal-root" hidden></div>
      <div id="import-modal-root" hidden></div>
      <div id="export-modal-root" hidden></div>
      <div id="graph-modal-root" hidden></div>
      <div id="table-modal-root" hidden></div>
      <div id="help-modal-root" hidden></div>
      <div id="about-modal-root" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
