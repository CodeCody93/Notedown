<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarkItDown</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: asset: http://asset.localhost; connect-src 'self' ipc: http://ipc.localhost ws: http: https:; font-src 'self' data:"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%234f8cff'/%3E%3Ctext%20x='16'%20y='22'%20font-family='Arial,Helvetica,sans-serif'%20font-size='16'%20font-weight='700'%20fill='%23ffffff'%20text-anchor='middle'%3EM%E2%86%93%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <link rel="stylesheet" href="/src/styles/menu.css" />
    <link rel="stylesheet" href="/src/styles/editor.css" />
    <link rel="stylesheet" href="/src/styles/responsive.css" />
    <link rel="stylesheet" href="/src/styles/settings.css" />
  </head>
  <body>
    <div id="app">
      <header id="menubar" role="menubar" aria-label="Menu bar">
        <div id="menubar-root"></div>
      </header>
      <main id="editor-area">
        <div id="editor" class="editor-pane" aria-label="Editor"></div>
      </main>
      <footer id="statusbar" class="statusbar" role="status">
        <span id="status-filename">untitled.md</span>
        <span id="status-dirty" class="dirty-dot" hidden title="Unsaved changes"></span>
        <span class="status-spacer"></span>
        <span id="status-mode">Live</span>
        <span id="status-ln">Ln 1</span>
        <span id="status-col">Col 1</span>
        <span id="status-words">0 words</span>
        <span id="status-chars">0 chars</span>
      </footer>
      <div id="settings-modal-root" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
